modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All rights reserved"
issueTrackerURL = "https://github.com/boffmedia/teras/issues"

# Pixelmon-only mixins; TerasMixinPlugin skips them when Pixelmon is absent.
[[mixins]]
config = "teras.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Luisca"
credits = "Luisca"
description = '''
Teras companion mod for Pixelmon — 1.21.1 NeoForge port. SmartRotom in-game browser powered by MCEF.
'''

# Hard dependency on MCEF (provides the Chromium browser used by SmartRotom)
[[dependencies.${mod_id}]]
modId = "mcef"
type = "required"
versionRange = "[2.1.6,)"
ordering = "AFTER"
side = "CLIENT"

# Optional: the SmartRotom getSpawns query reads Pixelmon's spawner. Everything else (the browser)
# works without it, and getSpawns degrades to [] if Pixelmon is absent, so this is not required.
[[dependencies.${mod_id}]]
modId = "pixelmon"
type = "optional"
versionRange = "[9.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
