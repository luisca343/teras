modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All rights reserved"
issueTrackerURL = "https://github.com/boffmedia/teras/issues"

# Pixelmon-only mixins; TerasMixinPlugin skips them when Pixelmon is absent.
[[mixins]]
config = "teras.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Luisca"
credits = "Luisca"
description = '''
Teras companion mod for Pixelmon — 1.21.1 NeoForge port. SmartRotom in-game browser powered by MCEF.
'''

# Hard dependency on MCEF (provides the Chromium browser used by SmartRotom)
[[dependencies.${mod_id}]]
modId = "mcef"
type = "required"
versionRange = "[2.1.6,)"
ordering = "AFTER"
side = "CLIENT"

# Optional (client): WaterMedia 3.x powers the PictureFrame in-world displays. Only the client renders
# them, so the server never needs it; without it, frames stay blank but nothing else is affected.
# AFTER so WaterMedia's API is initialised before FrameRenderer first creates a player.
[[dependencies.${mod_id}]]
modId = "watermedia"
type = "optional"
versionRange = "[3.0,)"
ordering = "AFTER"
side = "CLIENT"

# Optional: the SmartRotom getSpawns query reads Pixelmon's spawner. Everything else (the browser)
# works without it, and getSpawns degrades to [] if Pixelmon is absent, so this is not required.
[[dependencies.${mod_id}]]
modId = "pixelmon"
type = "optional"
versionRange = "[9.3,)"
ordering = "AFTER"
side = "BOTH"

# Optional: the other supported battle engine. BattleProviders picks whichever of Pixelmon/Cobblemon
# is loaded; with neither present the battle commands report no engine. AFTER so the engine registers
# before BattleProviders resolves.
[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "optional"
versionRange = "[1.7,)"
ordering = "AFTER"
side = "BOTH"

# Optional: SimpleVoiceChat powers the SmartRotom ChatApp's voice calls (setCall/leaveCall). Teras
# discovers it through SVC's @ForgeVoicechatPlugin scan and reaches it only behind a ModList guard, so
# without it calls simply report "not installed" and everything else is unaffected. AFTER so SVC's
# plugin scan has run before our handlers first touch the server API.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
# SVC versions its mod as "<mc>-<svc>" (e.g. 1.21.1-2.6.20), so the range must key on the MC prefix,
# not the SVC number: "[2.6,)" would compare 1.21.1… against 2.6 and reject every build. 1.16.5 ranged
# the same way ("[1.16,)").
versionRange = "[1.21,)"
ordering = "AFTER"
side = "BOTH"

# Optional: the quest system (NPC catalog, dialog events, getMisiones) reads CustomNPCs' quest/dialog
# API. QuestBridge no-ops without it and getMisiones returns an empty list, so this is not required.
# AFTER: NpcAPI.Instance() must exist by the time common setup registers our handlers on its bus.
# NOTE: this is CustomNPCs-Unofficial (CurseForge project 1052708) — the original project (221826)
# never left 1.16 — but it keeps the same `customnpcs` mod id and `noppes.npcs.api` packages.
[[dependencies.${mod_id}]]
modId = "customnpcs"
type = "optional"
versionRange = "[1.21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
