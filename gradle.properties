org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Mod
mod_id=teras
mod_group=es.boffmedia
mod_version=0.2.0
mod_name=Teras

# Platform
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Two separate floors, and the higher one wins.
#
# 21.1.150 is GeckoLib's: geckolib 4.9.2 declares neoforge [21.1.150,) and Teras declares geckolib
# *required*, so any server below it fails to load the mod anyway.
#
# 21.1.200 is @EventBusSubscriber's. Loader 4.0.41 (shipped with 21.1.200) stopped reading the
# annotation's `bus` parameter and started routing each @SubscribeEvent method by whether its event
# implements IModBusEvent; loader 4.0.38/4.0.39 (21.1.150/21.1.180) still switch on `bus`, whose
# default is GAME. Teras no longer passes `bus`, so on those older loaders every mod-bus
# handler — payload registration, entity attributes, renderers, GUI layers, key mappings — would
# quietly register to the game bus and never fire. Nothing would crash; the mod would simply come up
# half-wired. That failure is silent, so the range refuses those versions rather than trusting it.
neoforge_version=21.1.241
neoforge_version_range=[21.1.200,)
loader_version_range=[4,)
java_version=21

# MCEF (CinemaMod) — https://mcef-download.cinemamod.com
mcef_version=2.1.6-1.21.1

# Plot storage drivers (jar-in-jar). SQLite is the default backend; MySQL is opt-in via config.json.
sqlite_version=3.47.1.0
mysql_version=9.1.0

# SnakeYAML (jar-in-jar) — admin-facing configs only; the data stores stay JSON.
snakeyaml_version=2.3

# Parchment mappings (human-readable param names)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
