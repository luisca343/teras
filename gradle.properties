org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Mod
mod_id=teras
mod_group=es.boffmedia
mod_version=0.2.0
mod_name=Teras

# Platform
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# 21.1.150 is a floor GeckoLib sets, not a preference: geckolib 4.9.2 declares
# neoforge [21.1.150,) and Teras declares geckolib *required*, so any server below it fails to
# load the mod anyway. The range says so rather than leaving [21.1.0,) to promise a compatibility
# the dependency graph already refuses — and to keep a jar compiled against .241 off a .77 server,
# where anything added in between is a NoSuchMethodError at the call site.
neoforge_version=21.1.241
neoforge_version_range=[21.1.150,)
loader_version_range=[4,)
java_version=21

# MCEF (CinemaMod) — https://mcef-download.cinemamod.com
mcef_version=2.1.6-1.21.1

# Plot storage drivers (jar-in-jar). SQLite is the default backend; MySQL is opt-in via config.json.
sqlite_version=3.47.1.0
mysql_version=9.1.0

# SnakeYAML (jar-in-jar) — admin-facing configs only; the data stores stay JSON.
snakeyaml_version=2.3

# Parchment mappings (human-readable param names)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
