plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

neoForge {
    version = "${neoforge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
    }

    mods {
        teras {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // MCEF (CinemaMod)
    maven { url = uri('https://mcef-download.cinemamod.com/repositories/releases') }
    maven { url = uri('https://mcef-download.cinemamod.com/repositories/snapshots') }
    // CurseForge (for Pixelmon / JourneyMap once their 1.21.1 coordinates are added)
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Compile against the MCEF common API (includes the bundled org.cef.* classes);
    // the NeoForge platform jar provides the browser implementation at runtime.
    compileOnly "com.cinemamod:mcef:${mcef_version}"
    runtimeOnly "com.cinemamod:mcef-neoforge:${mcef_version}"

    // Pixelmon 9.3.9 for 1.21.1 NeoForge (Pixelmon-1.21.1-9.3.9-universal.jar). compileOnly: the
    // server provides Pixelmon at runtime. NOTE: this Pixelmon build wants NeoForge >= 21.1.200 at
    // runtime (we compile against 21.1.77) — bump the runtime NeoForge on the server accordingly.
    compileOnly "curse.maven:pixelmon-389487:7026117"

    // --- Deferred until 1.21.1 coordinates are confirmed ---
    // compileOnly "curse.maven:journeymap-32274:<fileId>"
}

// Expand mod metadata placeholders in src/main/templates/META-INF/neoforge.mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_group              : mod_group,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
