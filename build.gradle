plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

neoForge {
    version = "${neoforge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }
    }

    mods {
        teras {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // MCEF (CinemaMod)
    maven { url = uri('https://mcef-download.cinemamod.com/repositories/releases') }
    maven { url = uri('https://mcef-download.cinemamod.com/repositories/snapshots') }
    // CurseForge (Pixelmon, Cobblemon, CustomNPCs, voicechat, backpacks)
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // JourneyMap API v2 — the interfaces are published here, NOT in the CurseForge mod jar
    // (that ships only the impls: ClientWaypointFactoryImpl, PluginWrapper, ...).
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'info.journeymap' }
    }
    // GeckoLib's own Cloudsmith maven. NOT Modrinth: its `maven.modrinth:geckolib:4.9.2`
    // coordinate resolves by version *number*, which GeckoLib reuses across loaders, and the jar
    // that comes back is the Fabric build — intermediary-named (class_2960), so nothing written
    // against Mojmap would compile. This repo publishes the loader in the artifact id.
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // Modrinth (Armourer's Workshop) — its CurseForge files are not API-distributable
    // (cursemaven answers 401). Verified NeoForge-flavoured, unlike GeckoLib's.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Compile against the MCEF common API (includes the bundled org.cef.* classes);
    // the NeoForge platform jar provides the browser implementation at runtime.
    compileOnly "com.cinemamod:mcef:${mcef_version}"
    runtimeOnly "com.cinemamod:mcef-neoforge:${mcef_version}"

    // WaterMedia 3.0.0.21 (CurseForge file 8342332) — the media engine behind the PictureFrame
    // in-world displays: MRL + MediaPlayer + GLEngine (FFMPEG-backed, no VLC install). compileOnly:
    // the player installs WaterMedia as its own mod (the user runs it for FancyMenu compat), so we
    // compile against org.watermedia.api.* and it is present at runtime. transitive=false — cursemaven
    // synthesises the POM from CurseForge relations and would otherwise drag in arbitrary versions.
    compileOnly("curse.maven:watermedia-869524:8342332") { transitive = false }
    // Deliberately NOT on the dev runtime. WaterMedia's CodecsAPI/PlatformAPI/MediaAPI all fail to
    // start under runServer — it wants native FFMPEG binaries unpacked beside a real installation —
    // and the failures abort server startup. Frames have to be tested on a real server.

    // --- Battle engines: both compileOnly. Exactly one is present at runtime; the mod detects
    //     which via ModList and selects the matching BattleProvider (see pixelmon/battle/api). ---

    // Pixelmon 9.3.16 for 1.21.1 NeoForge (CurseForge file 8042508). Recent Pixelmon builds want
    // NeoForge >= 21.1.200 at runtime, which the build now compiles against and requires anyway
    // (gradle.properties) — so this is no longer a constraint to remember when provisioning.
    compileOnly "curse.maven:pixelmon-389487:8042508"
    // On the dev runtime behind -Pdev_pixelmon=true, off by default. It boots and the battle
    // provider selects correctly, but Pixelmon logs a missing-tag error every time
    // (pixelmon:spawning/drowned wants pixelmon:drowned_crimson/_dark/_warm, which live in its TCG
    // sibling) and it roughly doubles boot time. Not worth paying on every dungeon build; turn it on
    // for battle, starbank, hunt-quest or dex work:
    //     ./gradlew runServer -Pdev_pixelmon=true
    if (Boolean.parseBoolean((project.findProperty('dev_pixelmon') ?: 'false') as String)) {
        runtimeOnly "curse.maven:pixelmon-389487:8042508"
    }

    // Cobblemon 1.7.3+1.21.1 (CurseForge file 7553231). transitive=false: the fat jar carries the
    // API classes we compile against; its runtime deps (architectury, KotlinForForge) are provided
    // by the server. Kotlin stdlib is needed at compile time to call Cobblemon's Kotlin API from Java.
    compileOnly("curse.maven:cobblemon-687131:7553231") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // CustomNPCs-Unofficial (NeoForge 1.21.1.20251230, CurseForge file 7411561) — the original
    // CustomNPCs (project 221826) never left 1.16. Provides the quest/dialog/NPC API the Misiones
    // system builds on. compileOnly: the server supplies it, and Teras degrades without it.
    compileOnly "curse.maven:customnpcs-unofficial-1052708:7411561"
    // On the dev runtime too: the dungeon's bosses, mini-bosses and the entrance NPC are all
    // CustomNPCs clones, so without it runServer comes up with "CustomNPCs absent" and none of that
    // is exercisable. transitive=false for the reason given below — cursemaven synthesises POMs from
    // CurseForge's dependency relations and would drag in arbitrary file versions of other mods.
    runtimeOnly("curse.maven:customnpcs-unofficial-1052708:7411561") { transitive = false }

    // --- Optional integrations. All compileOnly + transitive=false: the server supplies them, each is
    //     declared optional in neoforge.mods.toml, and every touch point is behind a ModList guard so
    //     Teras degrades cleanly when they are absent. transitive=false because cursemaven synthesises
    //     POMs from CurseForge's "required dependency" relations, which would drag in an arbitrary
    //     file version of each — we pin the ones we actually compile against instead. ---

    // JourneyMap API v2 (stable release, not the -SNAPSHOT) — getWaypoints/addWaypoint compile against
    // this, not against the mod jar. JourneyMap 6.0.1 (CurseForge file 8448452) is the runtime the
    // server supplies; its jar carries only impl classes, so it is deliberately NOT a dependency here.
    // The 1.16.5 code used the v1 API (journeymap.client.api.*) plus the internal WaypointStore — both
    // are gone in 6.x; everything is journeymap.api.v2.* now.
    compileOnly "info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1"

    // Simple Voice Chat 2.6.20 (voicechat-neoforge-1.21.1-2.6.20.jar, file 8293091) — setCall/leaveCall
    // and the Tocadiscos audio path.
    compileOnly("curse.maven:voicechat-416089:8293091") { transitive = false }
    runtimeOnly("curse.maven:voicechat-416089:8293091") { transitive = false }

    // GeckoLib 4.9.2 for 1.21.1 NeoForge — animated models for dungeon enemies (server runtime
    // pin: CurseForge file 8350073, the same 4.9.2). CustomNPCs' GeckoLib compat layer (the "CNPC
    // Custom Model Addon") never reached 1.21.1, so the dungeon carries a first-party animated
    // enemy instead (DUNGEONS.md §Enemies) — same shape as the Frames decision: build on the
    // upstream library, don't fork the missing addon.
    compileOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2") { transitive = false }
    // …and on the dev runtime, unlike every other integration here. GeckoLib is declared *required*
    // in neoforge.mods.toml (teras:dungeon_enemy is a GeoEntity and its type registers
    // unconditionally), so a dev server without it does not degrade — the loader refuses to start
    // Teras at all. This is what kept `runServer` from booting; the version floor it forces is in
    // gradle.properties.
    runtimeOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2") { transitive = false }

    // Armourer's Workshop 3.4.0-beta.3 for 1.21.1 NeoForge (server runtime pin: CurseForge file
    // 8438936) — skin visuals for the dungeon-exclusive gear; the stats/effects/abilities layer is
    // Teras' own (dungeon/gear).
    compileOnly("maven.modrinth:armourers-workshop:3.4.0-beta.3+1.21.1-neoforge") { transitive = false }
    runtimeOnly("maven.modrinth:armourers-workshop:3.4.0-beta.3+1.21.1-neoforge") { transitive = false }

    // WorldEdit 7.3.8 (CurseForge file 5830452, single NeoForge/Fabric jar for MC 1.21–1.21.1) —
    // /teras region create|redefine read the admin's WE selection (//wand cuboid or //sel poly).
    // Only WorldEditBridge imports com.sk89q.*; without WorldEdit the region commands report how to
    // select, and tracking/protection/sync work regardless. On 1.16.5 WorldEdit was a hard dep but
    // only for schematics/biome tools; region membership was never WorldEdit's job.
    compileOnly("curse.maven:worldedit-225608:5830452") { transitive = false }
    runtimeOnly("curse.maven:worldedit-225608:5830452") { transitive = false }

    // Immersive Vehicles (MTS) 24.0.0 for 1.21.1 NeoForge (CurseForge file 7926606) — the kart base.
    // Replaces MrCrayfish's Vehicle Mod, which never left 1.16 and whose PoweredVehicleEntity the
    // 1.16.5 karts reached into by ObfuscationReflectionHelper. IV's jar carries both the core
    // (minecrafttransportsimulator.*) and the platform layer (mcinterface1211.*); only
    // karts/vehicle/iv/IvKartVehicleService imports either, behind a ModList("mts") guard, so the
    // rest of karts — tracks, engine, garage, rewards — compiles and runs without IV installed.
    compileOnly("curse.maven:minecraft-transport-simulator-286703:7926606") { transitive = false }

    // IV on the dev runtime, plus its content packs — IV ships no vehicles of its own, so a dev
    // client with none has nothing to race. Official Automobile Pack (1387229:7933542) and Official
    // Content Pack (292217:7933734). No Teras code names a pack item type; tracks and presets
    // reference packs by string id through PackParser. NOTE: IV discovers packs by scanning loaded
    // mod jars — if these are not picked up from the Gradle runtime classpath, drop the jars in
    // run/mods/ instead; nothing in the build depends on them resolving.
    //
    // All three together or none, and off unless -Pdev_iv=true. The packs used to be here
    // unconditionally while IV itself was compileOnly, so `oamp` and `mtsofficialpack` failed their
    // mandatory dependency on 'mts' and the dev server refused to start at all — one of the reasons
    // runServer never booted, independent of the GeckoLib ones above.
    //
    // Off by default because IV is only needed for karts, and with it the packs log ~150
    // recipe-parse errors on every boot (they ship JSON recipes for items IV registers through its
    // own PackParser, which the vanilla RecipeManager cannot resolve). Harmless, but it buries the
    // log for everyone working on anything else. Turn it on for kart work:
    //     ./gradlew runServer -Pdev_iv=true
    if (Boolean.parseBoolean((project.findProperty('dev_iv') ?: 'false') as String)) {
        runtimeOnly("curse.maven:minecraft-transport-simulator-286703:7926606") { transitive = false }
        runtimeOnly("curse.maven:mts-iv-official-automobile-pack-1387229:7933542") { transitive = false }
        runtimeOnly("curse.maven:transport-simulator-official-vehicle-set-292217:7933734") { transitive = false }
    }

    // Backpacks — deliberately NOT dependencies. Traveler's and Sophisticated both register the
    // standard NeoForge Capabilities.ItemHandler.ITEM on their backpack items, so the Pixelmon
    // BattleItemScanner bridge reads either (and any other container mod) through vanilla NeoForge
    // with no mod-specific imports. Audited coordinates, kept here in case that ever has to change:
    //   curse.maven:travelersbackpack-321117:8120689      (10.1.36)
    //   curse.maven:sophisticatedbackpacks-422301:8440487 (3.25.71.1997)
    //   curse.maven:sophisticatedcore-618298:8440438      (1.4.75.2161, SB's hard dependency)
    // See INTEGRATIONS.md for why, and for what the capability view does and does not show.

    // SQLite, jar-in-jar'd: the durable store for plot ownership and the money ledger. The whole
    // reason it is not another json store is BEGIN/COMMIT — a purchase is a debit plus an ownership
    // row plus a ledger row, and a crash between them leaves a player charged and unowned.
    // Bundled rather than compileOnly because no other mod supplies it; the version must be a range
    // for NeoForge's jar-in-jar metadata, which picks the newest among mods shipping the same lib.
    // Loaded through SQLiteDataSource, never DriverManager — see PlotDatabase.
    jarJar(implementation("org.xerial:sqlite-jdbc")) {
        version {
            strictly "[3.47.1.0,3.48)"
            prefer "${sqlite_version}"
        }
    }
    // MySQL, for the deployment where the SmartRotom backend shares this database and reads plot
    // ownership directly instead of being mirrored to over HTTP. Both drivers ship: SQLite is the
    // default and needs no setup (the tests and single-player use it), MySQL is opt-in via
    // config.json's sql block. transitive=false — the connector's POM drags in protobuf-java, which
    // nothing here calls.
    jarJar(implementation("com.mysql:mysql-connector-j")) {
        version {
            strictly "[9.1.0,10.0)"
            prefer "${mysql_version}"
        }
        transitive = false
    }

    // SnakeYAML — the admin-facing configs (config.yml, karts/config.yml) are YAML so they can carry
    // comments explaining each key. NeoForge ships NightConfig core+toml but not its YAML module, so
    // the parser has to come from here. Deliberately NOT used for the data stores: those are rewritten
    // by the mod on every mutation, which would destroy any comments in them, and their models are
    // already serialized by Gson for the HTTP wire format.
    jarJar(implementation("org.yaml:snakeyaml")) {
        version {
            strictly "[2.3,3.0)"
            prefer "${snakeyaml_version}"
        }
    }

    // Dev runs do not unpack jar-in-jar — FML only does that for real mod jars — so runClient and
    // runServer need these handed to them separately or the mod dies on NoClassDefFoundError at
    // startup. This configuration is the one the runs load.
    additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${sqlite_version}"
    additionalRuntimeClasspath("com.mysql:mysql-connector-j:${mysql_version}") { transitive = false }
    additionalRuntimeClasspath "org.yaml:snakeyaml:${snakeyaml_version}"

    // Unit tests for the engine-agnostic battle layer (config/mode/level parsing) — no Minecraft
    // or engine runtime required, so they run anywhere with `./gradlew test`.
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Gson reaches the main sources transitively via Minecraft; the test sourceset needs it directly.
    testImplementation "com.google.code.gson:gson:2.10.1"
    // Same for SLF4J. Anything touching Teras.LOGGER — which is most of the mod — fails to even class-load
    // without it, so a test for such a class needs the API here. Pinned to what Minecraft 1.21.1 ships.
    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-nop:2.0.9"
    // PlotDatabase takes its file path as an argument precisely so tests can point it at a temp dir
    // and exercise the real engine — transactions and constraints are the point, so mocking is not.
    testImplementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    // PlotDatabase names MysqlDataSource, so the test sourceset needs it on the classpath even
    // though the tests themselves only ever open SQLite.
    testImplementation("com.mysql:mysql-connector-j:${mysql_version}") { transitive = false }
    testImplementation "org.yaml:snakeyaml:${snakeyaml_version}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Expand mod metadata placeholders in src/main/templates/META-INF/neoforge.mods.toml
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_group              : mod_group,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
